[tool.poetry]
name = "docuvision"
version = "0.1.0"
description = "Document layout detection with DETR on DocLayNet"
authors = ["Alperen Dolunay <alperen.dolunayy@gmail.com>"]
readme = "README.md"

[tool.poetry.scripts]
docuvision = "docuvision.commands:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fire = "^0.5.0"
numpy = "^2.0.0"
pillow = "^10.0.0"
tqdm = "^4.65.0"
hydra-core = "^1.3.0"
omegaconf = "^2.3.0"
torch = {version = "^2.12.0", python = ">=3.10,<3.14"}
torchvision = {version = "^0.27.0", python = ">=3.10,<3.14"}
pytorch-lightning = "^2.0.0"
transformers = "^4.30.0"
torchmetrics = {version = "^1.0.0", extras = ["detection"]}
matplotlib = "^3.7.0"
mlflow = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.0.0"
ruff = "^0.3.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
